bundle:
  name: open_meteo_weather_pipeline

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - sql/**

variables:
  catalog:
    description: Unity Catalog catalog available in the target Databricks workspace
    default: main
  schema:
    description: Environment-specific schema for weather tables
    default: weather_pipeline_dev
  notification_email:
    description: Email address for Databricks job failure notifications
    default: rekhaghugtyal98@gmail.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: weather_pipeline_dev

  test:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: weather_pipeline_test

  prod:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: weather_pipeline_prod
