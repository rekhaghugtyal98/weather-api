bundle:
  name: open_meteo_weather_pipeline

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - sql/**

variables:
  catalog:
    description: Unity Catalog catalog available in the target Databricks workspace
    default: workspace
  schema:
    description: Environment-specific schema for weather tables
    default: weather_api_dev
  audit_schema:
    description: Schema for shared pipeline audit tables
    default: audit
  notification_email:
    description: Email address for Databricks job failure notifications
    default: rekhaghugtyal98@gmail.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: weather_api_dev
      audit_schema: audit

  test:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: weather_api_test
      audit_schema: audit

  prod:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: weather_api_prod
      audit_schema: audit
